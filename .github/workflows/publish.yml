name: publish to PyPI

# Publishing a GitHub release uploads the library to PyPI. PyPI trusts this
# workflow directly (trusted publishing), so no token is stored anywhere.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${{ github.event.release.tag_name }}" = "v$version" || { echo "tag ${{ github.event.release.tag_name }} != v$version"; exit 1; }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

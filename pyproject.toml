[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearleaf"
version = "0.1.0"
description = "MIT-licensed, pure-Python PDF library (read, render, edit, redact) with a PyMuPDF-style API and a local browser editor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clearleaf contributors" }]
keywords = ["pdf", "parser", "rendering", "text-extraction", "pdf-editor", "redaction", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
]
dependencies = []

[project.scripts]
clearleaf = "clearleaf.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=10.0"]
# Fidelity benchmark only (benchmarks/run_fidelity.py). PyMuPDF is used as a
# black-box reference for output comparison, never as a runtime dependency.
bench = ["pymupdf>=1.24", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/aaguadob/clearleaf"
Issues = "https://github.com/aaguadob/clearleaf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Substitute glyph outlines (Liberation Sans/Serif/Mono, SIL OFL 1.1 — see
# src/clearleaf/_fontdata/LIBERATION-LICENSE.txt) used to render text set in
# the standard-14 fonts when a PDF doesn't embed its own font program.
clearleaf = ["_fontdata/*.ttf", "_fontdata/*.txt", "_data/*.gz", "_data/*.txt", "editor/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
